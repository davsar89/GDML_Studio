name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --release

  step-import:
    name: STEP import (CAD worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The OCCT build (about 30 minutes) depends only on these two files.
      - uses: actions/cache@v4
        with:
          path: cad-worker/third_party/occt-*-linux
          key: occt-${{ hashFiles('cad-worker/occt-source.txt', 'cad-worker/occt-options.cmake') }}

      - name: Build the worker
        run: cad-worker/build-linux.sh

      - name: STEP tests
        run: >
          GDML_CAD_WORKER=$PWD/cad-worker/dist/cad/gdml-cad-worker
          cargo test --release --test cad_import_test -- --include-ignored step

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 7 requires ^20.19.0 || >=22.12.0.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Build mode, not --noEmit: see frontend/README.md#checks.
      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
